
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cùng Bạn Học Tập 🎒</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-bg: #fff;
            --line-color: #e0f2fe;
            --margin-color: #fca5a5;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f9ff;
            /* Nền vở ô ly tiểu học */
            background-image: 
                linear-gradient(var(--line-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--line-color) 1px, transparent 1px);
            background-size: 30px 30px;
            margin: 0;
            padding: 0;
        }
        .handwritten {
            font-family: 'Patrick Hand', cursive;
        }
        .paper-sheet {
            background: white;
            box-shadow: 10px 10px 0px #bae6fd;
            border: 3px solid #0ea5e9;
            position: relative;
        }
        .paper-sheet::before {
            content: '';
            position: absolute;
            left: 40px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--margin-color);
            opacity: 0.5;
        }
        .sticker-btn {
            transition: all 0.2s;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.1));
        }
        .sticker-btn:hover {
            transform: scale(1.1) rotate(2deg);
        }
        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
