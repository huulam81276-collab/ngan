<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cùng bạn học tập - Nhận Xét Bài Viết</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff9e6;
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 50%, #fff 50%, #fff 100%),
                linear-gradient(rgba(200,200,200,0.1) .1em, transparent .1em);
            background-size: 100% 2em;
        }
        .handwritten {
            font-family: 'Patrick Hand', cursive;
        }
        .notebook-page {
            background: white;
            background-image: radial-gradient(#e5e5e5 1px, transparent 1px);
            background-size: 20px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05), inset 0 0 0 10px white;
            border: 1px solid #ddd;
        }
        .sticker {
            filter: drop-shadow(2px 4px 0px rgba(0,0,0,0.1));
            transition: all 0.2s;
        }
        .sticker:hover {
            transform: scale(1.05) rotate(2deg);
        }
        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
